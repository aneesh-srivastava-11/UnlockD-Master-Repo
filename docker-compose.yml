services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    # Ensure frontend restarts if it crashes
    restart: unless-stopped
    # PARTICIPANT TODO: (Optional) If your frontend depends on the backend starting first, uncomment below:
    # depends_on:
    #   - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    # Ensure backend restarts if it crashes
    restart: unless-stopped
    environment:
      - DATABASE_URL=postgresql://admin:adminpassword@db:5432/finance_app?schema=public
      - JWT_SECRET=unlockd-hackathon-jwt-secret-2026
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: finance_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
      POSTGRES_DB: finance_app
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  db_data:

